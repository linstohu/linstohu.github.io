# Single package; this file also owns pnpm installation policy.
minimumReleaseAge: 1440
strictPeerDependencies: true
saveExact: true
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# astro2tsx 0.1.3 declares core 1.x but leaves the matching runtime as a broad
# transitive peer; automatic selection of runtime 2 beta breaks astro check.
packageExtensions:
  '@astrojs/astro2tsx@0.1.3':
    dependencies:
      '@emnapi/runtime': 1.11.3
