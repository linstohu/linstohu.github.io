name: Validate and deploy
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v6
      - name: Set up the pinned package manager and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Validate content and build the site
        run: pnpm run validate:static
      - name: Decide whether browser checks are needed
        id: browsers
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          required=true
          if [[ "$EVENT_NAME" != 'workflow_dispatch' && "$BASE_SHA" =~ ^[0-9a-f]{40}$ && ! "$BASE_SHA" =~ ^0+$ ]]; then
            if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
              # Content and documentation are covered by the static checks above.
              # Unknown paths and unavailable history keep the full browser gate.
              git diff --name-only -z "$BASE_SHA" HEAD -- . ':!content/**' ':!docs/**' ':!README.md' ':!CLAUDE.md' > "$RUNNER_TEMP/browser-changes"
              if [[ ! -s "$RUNNER_TEMP/browser-changes" ]]; then
                required=false
              fi
            fi
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
      - name: Install headless browsers for code changes
        if: steps.browsers.outputs.required == 'true'
        run: pnpm exec playwright install --with-deps --only-shell chromium webkit
      - name: Check desktop, Android and iPhone browsers
        if: steps.browsers.outputs.required == 'true'
        run: pnpm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist
          include-hidden-files: true
      - name: Check deployment configuration
        if: github.event_name != 'pull_request' && github.ref_type == 'branch'
        id: deployment
        env:
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "$CF_PROJECT" && -n "$CF_TOKEN" && -n "$CF_ACCOUNT" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Validation passed. Deployment is disabled until CLOUDFLARE_PAGES_PROJECT, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are configured."
          fi
      - name: Deploy the validated output to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref_type == 'branch' && steps.deployment.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: >-
          pnpm exec wrangler pages deploy dist
          --project-name "$CF_PROJECT"
          --branch "$GITHUB_REF_NAME"
          --commit-hash "$GITHUB_SHA"
