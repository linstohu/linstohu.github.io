name: Validate and deploy
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v6
      - name: Set up the pinned package manager and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist
          include-hidden-files: true
      - name: Check deployment configuration
        if: github.event_name != 'pull_request' && github.ref_type == 'branch'
        id: deployment
        env:
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "$CF_PROJECT" && -n "$CF_TOKEN" && -n "$CF_ACCOUNT" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Validation passed. Deployment is disabled until CLOUDFLARE_PAGES_PROJECT, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are configured."
          fi
      - name: Deploy the validated output to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref_type == 'branch' && steps.deployment.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: >-
          pnpm exec wrangler pages deploy dist
          --project-name "$CF_PROJECT"
          --branch "$GITHUB_REF_NAME"
          --commit-hash "$GITHUB_SHA"
