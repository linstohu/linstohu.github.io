name: Validate and deploy
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  changes:
    name: Identify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      playwright: ${{ steps.scope.outputs.playwright }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          sparse-checkout: /package.json
          sparse-checkout-cone-mode: false
      - name: Select checks and browser image
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          full=true
          if [[ "$EVENT_NAME" != workflow_dispatch && "$BASE_SHA" =~ ^[0-9a-f]{40}$ && ! "$BASE_SHA" =~ ^0+$ ]] &&
             { git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 --filter=blob:none origin "$BASE_SHA"; } &&
             git diff --quiet --no-renames "$BASE_SHA" HEAD -- . ':!content/**' ':!docs/**' ':!README.md' ':!CLAUDE.md'; then
            full=false
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          if [[ "$full" == true ]]; then
            version=$(jq -er '.devDependencies["@playwright/test"] | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' package.json)
            echo "playwright=$version" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Check formatting, Node tests and types
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - &setup
        name: Install Node.js and project dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: .nvmrc
          require-lockfile: true
          cache: true
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm check

  browsers:
    name: Test reading in Chromium and WebKit
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-noble
      options: --shm-size=1g
    steps:
      - uses: actions/checkout@v6
      - *setup
      - name: Check desktop, Android and iPhone browsers
        run: pnpm run test:browser

  website:
    needs: [changes, checks, browsers]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require the checks selected for this change
        env:
          SCOPE: ${{ needs.changes.result }}/${{ needs.changes.outputs.full }}
          RESULTS: ${{ needs.checks.result }}/${{ needs.browsers.result }}
        run: |
          case "$SCOPE/$RESULTS" in
            success/true/success/success|success/false/skipped/skipped) ;;
            *) echo "::error::Required checks did not pass ($SCOPE/$RESULTS)"; exit 1 ;;
          esac
      - uses: actions/checkout@v6
      - *setup
      - name: Check formatting for content and documentation changes
        if: needs.changes.outputs.full == 'false'
        run: pnpm format:check
      - name: Build and verify the production site
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist
          include-hidden-files: true
          if-no-files-found: error
      - name: Check deployment configuration
        if: github.event_name != 'pull_request' && github.ref_type == 'branch'
        id: deployment
        env:
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "$CF_PROJECT" && -n "$CF_TOKEN" && -n "$CF_ACCOUNT" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Validation passed. Deployment is disabled until CLOUDFLARE_PAGES_PROJECT, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are configured."
          fi
      - name: Deploy the validated output to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref_type == 'branch' && steps.deployment.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: >-
          pnpm exec wrangler pages deploy dist
          --project-name "$CF_PROJECT"
          --branch "$GITHUB_REF_NAME"
          --commit-hash "$GITHUB_SHA"
